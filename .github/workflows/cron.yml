name: Review Processor Cron

on:
  schedule:
    # Runs every 30 minutes while the repository is private (to conserve GitHub Actions minutes).
    # Once the repository is made public, GitHub Actions minutes are free and unlimited for public repositories,
    # so this schedule can be changed to every 5 or 10 minutes (e.g. '*/5 * * * *' or '*/10 * * * *').
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  process-reviews:
    name: Process Incomplete & Stale Reviews
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Call Cron Review Processor
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::error::APP_URL variable is not configured in repository variables."
            exit 1
          fi

          # Trigger the review processor endpoint with secret header without printing secret values
          curl -s -S -X POST "${{ vars.APP_URL }}/api/cron/process-reviews" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
